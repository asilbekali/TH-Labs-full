<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="TH-Labs: AI dubbing that keeps the speaker's own voice">
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 68px; font-weight: 800; fill: #F8FAFC; letter-spacing: -1.5px; }
    .sub { font-size: 22px; fill: #94A3B8; }
    .lead { font-size: 20px; fill: #64748B; }
    .lang { font-size: 20px; font-weight: 700; fill: #2DD4BF; opacity: 0; animation: lang 12.5s infinite; }
    .l2 { animation-delay: 2.5s; } .l3 { animation-delay: 5s; } .l4 { animation-delay: 7.5s; } .l5 { animation-delay: 10s; }
    @keyframes lang { 0% { opacity: 0; transform: translateY(8px); } 3%, 17% { opacity: 1; transform: translateY(0); } 20%, 100% { opacity: 0; transform: translateY(-8px); } }

    .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.4s ease-in-out infinite; }
    @keyframes wave { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }

    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { .bar, .dot, .lang { animation: none; } .l1 { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="none" stroke="#1E293B"/>

  <g class="font">
    <circle class="dot" cx="70" cy="70" r="6" fill="#F59E0B"/>
    <text x="86" y="76" font-size="15" font-weight="600" fill="#F59E0B" letter-spacing="2">AI DUBBING · VOICE PRESERVATION</text>

    <text class="title" x="64" y="158">TH-Labs</text>
    <text class="sub" x="64" y="200">Dub any video and keep the speaker's own voice.</text>

    <text class="lead" x="64" y="252">Now translating into</text>
    <g transform="translate(262 252)">
      <text class="lang l1">Uzbek</text>
      <text class="lang l2">Russian</text>
      <text class="lang l3">Spanish</text>
      <text class="lang l4">Arabic</text>
      <text class="lang l5">30+ more</text>
    </g>
  </g>

  <!-- Waveform: 36 bars with staggered delays so the wave appears to travel. -->
  <g transform="translate(700 90)" fill="url(#waveGrad)">
    <rect class="bar" x="0"   y="20" width="8" height="100" rx="2" style="animation-delay:-0.00s"/>
    <rect class="bar" x="13"  y="10" width="8" height="120" rx="2" style="animation-delay:-0.08s"/>
    <rect class="bar" x="26"  y="30" width="8" height="80"  rx="2" style="animation-delay:-0.16s"/>
    <rect class="bar" x="39"  y="0"  width="8" height="140" rx="2" style="animation-delay:-0.24s"/>
    <rect class="bar" x="52"  y="25" width="8" height="90"  rx="2" style="animation-delay:-0.32s"/>
    <rect class="bar" x="65"  y="15" width="8" height="110" rx="2" style="animation-delay:-0.40s"/>
    <rect class="bar" x="78"  y="35" width="8" height="70"  rx="2" style="animation-delay:-0.48s"/>
    <rect class="bar" x="91"  y="5"  width="8" height="130" rx="2" style="animation-delay:-0.56s"/>
    <rect class="bar" x="104" y="20" width="8" height="100" rx="2" style="animation-delay:-0.64s"/>
    <rect class="bar" x="117" y="40" width="8" height="60"  rx="2" style="animation-delay:-0.72s"/>
    <rect class="bar" x="130" y="10" width="8" height="120" rx="2" style="animation-delay:-0.80s"/>
    <rect class="bar" x="143" y="25" width="8" height="90"  rx="2" style="animation-delay:-0.88s"/>
    <rect class="bar" x="156" y="0"  width="8" height="140" rx="2" style="animation-delay:-0.96s"/>
    <rect class="bar" x="169" y="30" width="8" height="80"  rx="2" style="animation-delay:-1.04s"/>
    <rect class="bar" x="182" y="15" width="8" height="110" rx="2" style="animation-delay:-1.12s"/>
    <rect class="bar" x="195" y="35" width="8" height="70"  rx="2" style="animation-delay:-1.20s"/>
    <rect class="bar" x="208" y="5"  width="8" height="130" rx="2" style="animation-delay:-1.28s"/>
    <rect class="bar" x="221" y="20" width="8" height="100" rx="2" style="animation-delay:-1.36s"/>
    <rect class="bar" x="234" y="10" width="8" height="120" rx="2" style="animation-delay:-0.04s"/>
    <rect class="bar" x="247" y="40" width="8" height="60"  rx="2" style="animation-delay:-0.12s"/>
    <rect class="bar" x="260" y="25" width="8" height="90"  rx="2" style="animation-delay:-0.20s"/>
    <rect class="bar" x="273" y="0"  width="8" height="140" rx="2" style="animation-delay:-0.28s"/>
    <rect class="bar" x="286" y="30" width="8" height="80"  rx="2" style="animation-delay:-0.36s"/>
    <rect class="bar" x="299" y="15" width="8" height="110" rx="2" style="animation-delay:-0.44s"/>
    <rect class="bar" x="312" y="5"  width="8" height="130" rx="2" style="animation-delay:-0.52s"/>
    <rect class="bar" x="325" y="35" width="8" height="70"  rx="2" style="animation-delay:-0.60s"/>
    <rect class="bar" x="338" y="20" width="8" height="100" rx="2" style="animation-delay:-0.68s"/>
    <rect class="bar" x="351" y="10" width="8" height="120" rx="2" style="animation-delay:-0.76s"/>
    <rect class="bar" x="364" y="40" width="8" height="60"  rx="2" style="animation-delay:-0.84s"/>
    <rect class="bar" x="377" y="25" width="8" height="90"  rx="2" style="animation-delay:-0.92s"/>
    <rect class="bar" x="390" y="0"  width="8" height="140" rx="2" style="animation-delay:-1.00s"/>
    <rect class="bar" x="403" y="30" width="8" height="80"  rx="2" style="animation-delay:-1.08s"/>
    <rect class="bar" x="416" y="15" width="8" height="110" rx="2" style="animation-delay:-1.16s"/>
    <rect class="bar" x="429" y="35" width="8" height="70"  rx="2" style="animation-delay:-1.24s"/>
    <rect class="bar" x="442" y="20" width="8" height="100" rx="2" style="animation-delay:-1.32s"/>
    <rect class="bar" x="455" y="10" width="8" height="120" rx="2" style="animation-delay:-1.40s"/>
  </g>
</svg>
