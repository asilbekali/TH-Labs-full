<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Pipeline: VAD, ASR, NMT, TTS, Voice clone, Sync and mux">
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
    .engine { font-size: 13px; fill: #94A3B8; }
    .step { font-size: 12px; font-weight: 700; fill: #64748B; letter-spacing: 1.5px; }

    /* Each stage lights up for ~1s, one after another, on a 6s loop. */
    .box { fill: #111C2E; stroke: #1E293B; stroke-width: 1.5; animation: lit 6s infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; } .s4 { animation-delay: 3s; } .s5 { animation-delay: 4s; } .s6 { animation-delay: 5s; }
    @keyframes lit {
      0%, 20%, 100% { fill: #111C2E; stroke: #1E293B; }
      4%, 16% { fill: #0E2A2B; stroke: #2DD4BF; }
    }

    .pulse { animation: travel 6s linear infinite; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(1120px); } }

    @media (prefers-reduced-motion: reduce) { .box, .pulse { animation: none; } }
  </style>

  <rect width="1200" height="210" rx="12" fill="#0B1220"/>
  <rect x="0.5" y="0.5" width="1199" height="209" rx="12" fill="none" stroke="#1E293B"/>

  <!-- Track the pulse runs along, under the boxes. -->
  <line x1="40" y1="160" x2="1160" y2="160" stroke="#1E293B" stroke-width="2"/>
  <circle class="pulse" cx="40" cy="160" r="5" fill="#F59E0B"/>

  <g class="font">
    <!-- 6 boxes, 160 wide, 32 apart, starting at x=40 -->
    <g transform="translate(40 40)">
      <rect class="box s1" width="160" height="96" rx="6"/>
      <text class="step" x="16" y="26">01</text>
      <text class="name" x="16" y="56">VAD</text>
      <text class="engine" x="16" y="78">silero-vad</text>
    </g>
    <g transform="translate(232 40)">
      <rect class="box s2" width="160" height="96" rx="6"/>
      <text class="step" x="16" y="26">02</text>
      <text class="name" x="16" y="56">Speech → text</text>
      <text class="engine" x="16" y="78">Whisper</text>
    </g>
    <g transform="translate(424 40)">
      <rect class="box s3" width="160" height="96" rx="6"/>
      <text class="step" x="16" y="26">03</text>
      <text class="name" x="16" y="56">Translate</text>
      <text class="engine" x="16" y="78">NLLB-200</text>
    </g>
    <g transform="translate(616 40)">
      <rect class="box s4" width="160" height="96" rx="6"/>
      <text class="step" x="16" y="26">04</text>
      <text class="name" x="16" y="56">Text → speech</text>
      <text class="engine" x="16" y="78">edge-tts</text>
    </g>
    <g transform="translate(808 40)">
      <rect class="box s5" width="160" height="96" rx="6"/>
      <text class="step" x="16" y="26">05</text>
      <text class="name" x="16" y="56">Voice clone</text>
      <text class="engine" x="16" y="78">OpenVoice v2</text>
    </g>
    <g transform="translate(1000 40)">
      <rect class="box s6" width="160" height="96" rx="6"/>
      <text class="step" x="16" y="26">06</text>
      <text class="name" x="16" y="56">Sync &amp; mux</text>
      <text class="engine" x="16" y="78">Demucs · ffmpeg</text>
    </g>

    <!-- Chevrons between boxes -->
    <g fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 82 l6 6 -6 6"/>
      <path d="M402 82 l6 6 -6 6"/>
      <path d="M594 82 l6 6 -6 6"/>
      <path d="M786 82 l6 6 -6 6"/>
      <path d="M978 82 l6 6 -6 6"/>
    </g>

    <text x="40" y="192" font-size="13" fill="#64748B">source video</text>
    <text x="1160" y="192" font-size="13" fill="#64748B" text-anchor="end">dubbed video, same voice</text>
  </g>
</svg>
