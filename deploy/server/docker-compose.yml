# Production stack for the account API. Lives at /srv/th-labs on the server.
#
# Unlike the compose file at the repo root, this one never builds — it pulls a
# published image from GHCR. The server does not need a checkout of this repo,
# a toolchain, or Node; only this file and .env.
#
# Caddy is deliberately NOT in here. TLS for the whole box is terminated by
# solpro-caddy-1, which belongs to the separate stack in /opt/solpro. This is a
# distinct compose project so the two can be started and stopped independently:
# `docker compose down` here must never be able to take solpra.uz offline, and
# the same in reverse.
#
# Nothing below publishes a host port. The services join solpro's network under
# `thlabs-` aliases, Caddy reaches them by name exactly as it reaches
# `solpra:4000`, and the only route in is through Caddy.

name: th-labs

networks:
  # Created and owned by /opt/solpro. Declared external so this stack attaches
  # to it and never attempts to create or remove it.
  edge:
    external: true
    name: solpro_default
  # Private to this stack: db is reachable here and nowhere else.
  internal:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thlabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thlabs}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL",
         "pg_isready -U ${POSTGRES_USER:-thlabs} -d ${POSTGRES_DB:-thlabs}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      # internal only — deliberately NOT on edge, so the database is
      # unreachable from solpro's containers as well as from the internet.
      - internal
    # No ports mapping at all. The database is reachable over the compose
    # network by the API and by nothing else; use `docker compose exec` for a
    # psql session rather than opening a port.

  api:
    # Overridable so a rollback is a one-liner:
    #   API_IMAGE=ghcr.io/asilbekali/th-labs-full/api:sha-<commit> docker compose up -d api
    image: ${API_IMAGE:-ghcr.io/asilbekali/th-labs-full/api:latest}
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-thlabs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thlabs}?schema=public
      # No defaults on purpose — the app falls back to the literals
      # 'dev-secret' / 'dev-refresh-secret', which are in the public repo.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NODE_ENV: production
      PORT: "3000"
      HOST: ${PUBLIC_HOST:-aytingchi.uz}

      # Browser origins allowed to call this API directly. The Studio on Modal
      # is a different origin and redeems its handoff code from the BROWSER, so
      # omitting it here is what makes sign-in fail there. Comma-separated;
      # unset falls back to DEFAULT_CORS_ORIGINS in api/src/main.ts.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_URL: ${APP_URL:-https://th-labs.uz}

      # ── Stripe ───────────────────────────────────────────────────────────
      # Absent, the API still BOOTS and still serves /payments/plans — which is
      # why this was easy to miss. What it cannot do is take money:
      #
      #   no STRIPE_SECRET_KEY    -> StripeProvider yields null, stripe.enabled
      #                              is false, subscription cancel 503s
      #   no STRIPE_WEBHOOK_SECRET-> constructEvent throws before any dispatch,
      #                              so EVERY Stripe event is rejected. Webhooks
      #                              are the only thing that grants credits, so
      #                              a user pays and receives nothing.
      #   no STRIPE_LINK_*        -> prisma/seed.ts writes stripeLinkUrl: null,
      #                              and /payments/checkout 400s with "No Stripe
      #                              Payment Link configured" before the user
      #                              ever reaches Stripe.
      #
      # All optional at the container level on purpose (see env.validation.ts):
      # a deploy with no payments configured should degrade, not refuse to boot.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # Payment Link URLs, one per plan row. Read by prisma/seed.ts at seed
      # time, NOT on every boot — changing one means re-running the seed.
      STRIPE_LINK_PRO_WEEKLY: ${STRIPE_LINK_PRO_WEEKLY:-}
      STRIPE_LINK_PRO_MONTHLY: ${STRIPE_LINK_PRO_MONTHLY:-}
      STRIPE_LINK_PRO_YEARLY: ${STRIPE_LINK_PRO_YEARLY:-}
      STRIPE_LINK_STUDIO_WEEKLY: ${STRIPE_LINK_STUDIO_WEEKLY:-}
      STRIPE_LINK_STUDIO_MONTHLY: ${STRIPE_LINK_STUDIO_MONTHLY:-}
      STRIPE_LINK_STUDIO_YEARLY: ${STRIPE_LINK_STUDIO_YEARLY:-}

      # Cap on the one free dub every new user gets. Mirrors
      # FREE_DUB_MAX_SECONDS in api/src/payment/quality-cost.ts.
      FREE_DUB_MAX_SECONDS: ${FREE_DUB_MAX_SECONDS:-120}
    networks:
      internal:
      edge:
        # What Caddy proxies /v1/* and /docs* to. Prefixed so it cannot
        # collide with solpro's own service names on the shared network.
        aliases: [thlabs-api]
    volumes:
      # The app writes its own app/error/audit logs here. Without a volume they
      # live in the container's writable layer and are discarded on every
      # deploy, which would take the audit trail with them.
      - api-logs:/app/logs
    init: true
    healthcheck:
      test:
        ["CMD", "node", "-e",
         "fetch('http://127.0.0.1:3000/v1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      # Container logs are unbounded by default and will eventually fill the
      # disk on a small VPS.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The landing page (ProLend repo). Image only — it is built by that repo's
  # own workflow, so this stack never needs its source.
  web:
    image: ${WEB_IMAGE:-ghcr.io/asilbekali/prolend/web:latest}
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The compose service name, not a public URL. lib/backend.ts is the only
      # thing that talks to the API, and it runs server-side, so this traffic
      # never leaves the Docker network — no CORS, no TLS hop, and the API does
      # not have to be internet-facing for the landing page to work.
      BACKEND_API_URL: http://api:3000/v1
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      # Server-side only. NEXT_PUBLIC_* values are absent here on purpose:
      # `next build` inlines them, so they are build args in that repo's
      # workflow and setting them at runtime would do nothing.
      GOOGLE_AUTH_SECRET: ${GOOGLE_AUTH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      internal:
      edge:
        aliases: [thlabs-web]
    init: true
    healthcheck:
      test:
        ["CMD", "node", "-e",
         "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  api-logs:
