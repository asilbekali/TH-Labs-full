<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Must track --c-canvas in src/index.css, or the mobile browser chrome
         reads as a different colour to the page behind it. -->
    <meta name="theme-color" content="#0a0908" />
    <meta name="description" content="TH-Labs — identity-preserving AI video dubbing. Whisper ASR, NLLB translation, OmniVoice voice cloning, optional lip sync." />

    <!-- Apply the theme before first paint to avoid a flash. Uses the stored
         choice, else dark. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('th-labs.theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- TH-Labs typography: Geist (everything), Geist Mono (eyebrows, code)
         and Outfit (figures), self-hosted. @font-face lives in src/index.css;
         no runtime web-font request is made. Preload the primary Latin subset. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin.woff2" crossorigin />

    <title>TH-Labs · AI Dubbing with Voice Preservation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
