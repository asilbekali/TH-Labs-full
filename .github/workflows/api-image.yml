# Builds the account API into a container image, publishes it to GitHub
# Container Registry, then tells the server to pull it.
#
# The build is path-filtered: nothing here runs when only backend/, frontend/,
# or deploy/ change, because none of those are part of this image.

name: api image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  # A second push to main supersedes an in-flight deploy rather than racing it
  # to the server.
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: img
        # GHCR rejects uppercase paths and this repository is "TH-Labs-full",
        # so the owner/repo pair has to be lowercased before it is used.
        run: echo "name=${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Scoped to this repository and expires with the run — no PAT needed
          # to push. Pulling on the server is a different matter, see the README.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
        # `latest` is what the server tracks; the sha tag is what makes a
        # rollback possible after latest has moved on.

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # bcrypt compiles from source on a cache miss, which dominates the
          # build. Persisting the layer cache between runs takes this from
          # minutes to seconds when only src/ changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Without this, buildx attaches a provenance attestation that shows up
          # in the GHCR package listing as a phantom "unknown/unknown" platform.
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # `environment` is the gate to add a required reviewer later, if you ever
    # want deploys to be approved rather than automatic.
    environment: production
    steps:
      - name: Pull and restart on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # The image is built and pushed regardless; only the rollout needs a
          # server to talk to. Until the four secrets exist this exits clean
          # rather than red, so a missing deploy target is reported as "not
          # configured yet" instead of masquerading as a broken pipeline.
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets not configured - skipping rollout. The image was built and pushed to GHCR; see deploy/server/README.md."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned from a secret rather than ssh-keyscan at run time: scanning
          # trusts whatever answers on the day, which defeats the point of
          # host verification.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            'set -e
             cd /srv/th-labs
             docker compose pull api
             docker compose up -d api
             docker image prune -f'
