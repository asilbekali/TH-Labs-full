# Checks every pull request into develop or main before it can be merged.
#
# One job per app, each running only the scripts that app's own package.json
# (or requirements.txt) defines. Type-checking is part of each build:
# `nest build` compiles api/ with tsc, and frontend's build script is
# `tsc -b && vite build`, so a type error fails the build step.

name: ci

on:
  pull_request:
    branches: [develop, main]
    # Docs-only changes have nothing to build or test.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  # A new push to the same PR makes the previous run's result irrelevant.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION in api/Dockerfile.
          node-version: 22
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        # Lint and build both need the generated types; without them every
        # Prisma call reads as an unresolved type.
        run: npx prisma generate

      - name: Lint
        # The package.json `lint` script passes --fix, which would rewrite files
        # on the runner and hide what a developer needs to fix, so eslint runs
        # here with the same globs but without it.
        #
        # Non-blocking until the existing errors on main are cleaned up; delete
        # continue-on-error in that PR so lint starts gating merges.
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - run: yarn test

      - name: Type-check and build
        run: yarn build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # frontend has no test script yet.

      - name: Type-check and build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        # requirements.txt is the light core only. The tests also import numpy
        # and soundfile, which belong to the optional audio stack, so they are
        # added here rather than to the core requirements.
        run: pip install -r requirements.txt pytest numpy soundfile

      - name: Test
        # This one test drives the OmniVoice renderer, which needs torch and the
        # 16 GB model stack that requirements.txt deliberately leaves optional.
        run: >
          python -m pytest -q tests
          --deselect tests/test_speech.py::test_omnivoice_render_passes_language_and_voice
